name: Release
# Dual-train releases (spec 206, ticket 207): `win-v*` ships the Windows
# installer, `mac-v*` ships the Mac bundle. Either tag alone ships one
# platform; pushing both tags (even on one commit) produces two workflow runs
# — one per tag — and therefore two independent Releases. Bare `v*` tags are
# retired: they match no trigger here and both updaters ignore them.
on:
  push:
    tags: ['win-v*', 'mac-v*']
permissions:
  contents: write
jobs:
  release-windows:
    if: startsWith(github.ref, 'refs/tags/win-v')
    runs-on: windows-latest
    steps:
      # Third-party actions pinned by commit SHA: this workflow carries
      # repository secrets, and a hijacked mutable tag would exfiltrate them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
      - name: Tag must equal the Windows train version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("win-v$cargo" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Windows train version win-v$cargo (src-tauri/Cargo.toml)" }
      - run: npm ci
      - run: npm run tauri build
      # ADR-0012 scheme B: every published installer must carry its minisign
      # signature — a missing or empty secret fails the step, so an unsigned
      # setup exe can never ship.
      - name: Sign the setup exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SPROUT_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SPROUT_SIGNING_PASSWORD }}
        run: |
          $exe = @(Get-ChildItem src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe)
          if ($exe.Count -ne 1) { throw "expected exactly one setup exe, found $($exe.Count)" }
          npx tauri signer sign "$($exe.FullName)"
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "signature file was not produced" }
          # tauri signer sign writes its sidecar base64-wrapped (Tauri's own
          # updater format), but Sprout's shipped verifiers read bare minisign
          # text (ADR-0012) — unwrap in place so every installed generation
          # can verify this release. The app side accepts both shapes.
          $sigPath = "$($exe.FullName).sig"
          $wrapped = ((Get-Content $sigPath -Raw).Trim()) -replace '\s', ''
          $minisign = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($wrapped))
          if (-not $minisign.StartsWith('untrusted comment:')) { throw 'unexpected signature payload after unwrap' }
          [IO.File]::WriteAllText($sigPath, $minisign, [Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe.sig
  release-mac:
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: macos-latest
    steps:
      # Same pinning rule as above: secrets are in scope here too.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
      - name: Tag must equal the Mac train version
        shell: bash
        run: |
          cargo=$(grep -E '^version = "' src-tauri/mac/Cargo.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "mac-v$cargo" != "${{ github.ref_name }}" ]; then echo "tag ${{ github.ref_name }} != Mac train version mac-v$cargo (src-tauri/mac/Cargo.toml)"; exit 1; fi
      - run: npm ci
      # Mac bundle wiring (dmg target, frontend Mac flag) lands in tickets
      # 215/218 — this step defines the contract now: a `mac-v*` tag builds
      # the Mac bundle from the Mac train version.
      - run: npm run tauri build
      # ADR-0012 scheme B, Mac side: same key, same fail-closed rule — an
      # unsigned dmg can never ship. Unwrap mirrors the Windows step (bash +
      # node instead of pwsh).
      - name: Sign the dmg
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SPROUT_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SPROUT_SIGNING_PASSWORD }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/Sprout_*_aarch64.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then echo "expected exactly one dmg, found ${#dmgs[@]}"; exit 1; fi
          npx tauri signer sign "${dmgs[0]}"
          if [ ! -f "${dmgs[0]}.sig" ]; then echo "signature file was not produced"; exit 1; fi
          node -e "
          const fs = require('fs');
          const p = process.argv[1];
          const wrapped = fs.readFileSync(p, 'utf8').trim().replace(/\s/g, '');
          const minisign = Buffer.from(wrapped, 'base64').toString('utf8');
          if (!minisign.startsWith('untrusted comment:')) { console.error('unexpected signature payload after unwrap'); process.exit(1); }
          fs.writeFileSync(p, minisign);
          " "${dmgs[0]}.sig"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/Sprout_*_aarch64.dmg
            src-tauri/target/release/bundle/dmg/Sprout_*_aarch64.dmg.sig
