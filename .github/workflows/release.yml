name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      # Third-party actions pinned by commit SHA: this workflow carries
      # repository secrets, and a hijacked mutable tag would exfiltrate them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
      - name: Tag must equal Cargo.toml version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$cargo" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml $cargo" }
      - run: npm ci
      - run: npm run tauri build
      # ADR-0012 scheme B: every published installer must carry its minisign
      # signature — a missing or empty secret fails the step, so an unsigned
      # setup exe can never ship.
      - name: Sign the setup exe
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SPROUT_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SPROUT_SIGNING_PASSWORD }}
        run: |
          $exe = @(Get-ChildItem src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe)
          if ($exe.Count -ne 1) { throw "expected exactly one setup exe, found $($exe.Count)" }
          npx tauri signer sign "$($exe.FullName)"
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "signature file was not produced" }
          # tauri signer sign writes its sidecar base64-wrapped (Tauri's own
          # updater format), but Sprout's shipped verifiers read bare minisign
          # text (ADR-0012) — unwrap in place so every installed generation
          # can verify this release. The app side accepts both shapes.
          $sigPath = "$($exe.FullName).sig"
          $wrapped = ((Get-Content $sigPath -Raw).Trim()) -replace '\s', ''
          $minisign = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($wrapped))
          if (-not $minisign.StartsWith('untrusted comment:')) { throw 'unexpected signature payload after unwrap' }
          [IO.File]::WriteAllText($sigPath, $minisign, [Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Sprout_*_x64-setup.exe.sig
