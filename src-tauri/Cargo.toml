[package]
name = "sprout"
version = "0.1.0"
description = "Preset-driven Windows software-installation desktop app"
authors = ["Sprout contributors"]
edition = "2021"

[lib]
name = "sprout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
winreg = "0.56.0"
# ShellExecuteW "runas" — the single UAC prompt behind the worker relaunch;
# Win32_Storage_FileSystem gates SHGetFileInfoW (ticket 40's icon extraction).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winvd = "0.0.49"
# Aligned with the version winvd pulls; Win32_Storage_FileSystem gates
# IShellLinkW::GetPath, the lnk resolution behind the installed-app search.
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem"] }
png = "0.17"
# PNG → data URL for the search-result icons (ticket 40); already in the lock
# file as a transitive of tauri.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Size budget (spec NFR 43): the shipped exe must stay under ~10 MB. LTO +
# size-optimized codegen + stripped symbols + abort-on-panic keeps the release
# binary small; the NSIS installer compresses it further.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
