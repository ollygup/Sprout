[package]
name = "sprout"
# App version. Single source of truth: this file — tauri.conf.json omits
# `version` and Tauri v2 auto-inherits it from here into the exe metadata,
# the window, and the installer. Never restate it elsewhere.
version = "0.7.5"
description = "Preset-driven Windows software-installation desktop app"
authors = ["Sprout contributors"]
edition = "2021"

[lib]
name = "sprout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Auto-start registration (ADR-0013, ticket 75): the standard autostart
# plugin writing HKCU Run; initialized with the `--autostart` launcher arg
# ticket 76 consumes to boot tray-only.
tauri-plugin-autostart = "2"
# Quick Clips' clipboard writes (ticket 78): Rust-side only — our `copy_clip`
# command drives the plugin so no capability grants or npm package are needed.
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
winreg = "0.56.0"
# ShellExecuteW "runas" — the single UAC prompt behind the worker relaunch;
# Win32_Storage_FileSystem gates SHGetFileInfoW (ticket 40's icon extraction);
# Win32_System_SystemInformation gates GetLocalTime (ticket 64's run-log
# stamps — local wall clock without a chrono dependency, per the size budget).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", # Win32_Media gates timeBeginPeriod (ticket 63): 1 ms timer
# resolution while an auto-hide slide animates, or Sleep quantizes to ~15.6 ms
# and the motion stutters.
"Win32_Media",
# Win32_Devices_Display gates QueryDisplayConfig/DisplayConfigGetDeviceInfo
# (ticket 110): EDID make+product identity so dock memory follows the panel,
# not the slot number Windows happened to assign it.
"Win32_Devices_Display"] }
winvd = "0.0.49"
# Aligned with the version winvd pulls; Win32_Storage_FileSystem gates
# IShellLinkW::GetPath, the lnk resolution behind the installed-app search.
# Management_Deployment + ApplicationModel gate PackageManager/FindPackages
# (ticket 122 Store scan) — WinRT, no extra size budget impact beyond the
# already-pulled windows crate.
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Management_Deployment", "ApplicationModel", "ApplicationModel_Core", "Foundation_Collections", "Storage", "Storage_Streams", "Graphics_Imaging"] }
png = "0.17"
# PNG → data URL for the search-result icons (ticket 40); already in the lock
# file as a transitive of tauri.
base64 = "0.22"
# Self-update transport (ADR-0012): ureq on rustls — TLS-only integrity by
# decision, and the smallest client that avoids tauri-plugin-updater's
# signing-key machinery. Keep features minimal: spec NFR 43 budgets the
# shipped exe under ~10 MB, and rustls is this crate's only heavy piece.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Update-signature verification (ADR-0012 scheme B): CI signs each setup exe
# with an ed25519 minisign key and the app refuses to run anything that does
# not verify against the embedded public key. Tiny pure-Rust verifier — no
# Tauri updater baggage, no size-budget impact.
minisign-verify = "0.2"

[dev-dependencies]
tempfile = "3"

# Size budget (spec NFR 43): the shipped exe must stay under ~10 MB. LTO +
# size-optimized codegen + stripped symbols + abort-on-panic keeps the release
# binary small; the NSIS installer compresses it further.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
